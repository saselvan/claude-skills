<!-- The caption track: one scene spanning the whole film. Cues come from the data list, which is generated from
     script.md (the same text as the .srt). Captions roll as whole lines at DUR.words. -->
<template id="cap-template">
  <div data-composition-id="cap" data-width="1080" data-height="1350">
    <div id="cap-band" data-caption-band></div>
    <style>
      [data-composition-id="cap"] { background: transparent; }
      [data-composition-id="cap"] #cap-band {
        position: absolute; left: 60px; right: 60px; bottom: 90px; min-height: 160px;
        font-size: var(--fs-caption); font-weight: 400; line-height: 1.1; color: var(--ink);
      }
      [data-composition-id="cap"] .cue { position: absolute; left: 0; right: 0; bottom: 0; white-space: pre-line; }
    </style>
    <script>
      (function () {
        var id = "cap";
        var root = document.querySelector('[data-composition-id="' + id + '"]');
        var band = root.querySelector("#cap-band");
        // [start, end, text] in root seconds. Keep in step with film.srt: check_film's burned-captions check compares them.
        var CUES = [
          [0.0, 5.0, "Who shares patients with Dr. A?"],
          [5.0, 9.0, "The index goes straight to the row."],
          [9.0, 13.0, "One lookup reads one row, no scan."],
        ];
        var tl = gsap.timeline({ paused: true });
        CUES.forEach(function (c, i) {
          var el = document.createElement("div");
          el.className = "cue"; el.textContent = c[2]; band.appendChild(el);
          gsap.set(el, { opacity: 0, y: 8 });
          tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: DUR.words, ease: EASE.move, immediateRender: false }, c[0]);
          if (i < CUES.length - 1) tl.to(el, { opacity: 0, y: -8, duration: DUR.tick, ease: EASE.settle }, c[1] - DUR.tick);
        });
        tl.set({}, {}, 13);
        window.__timelines[id] = tl;
      })();
    </script>
  </div>
</template>
