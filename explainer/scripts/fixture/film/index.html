<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>check fixture — 4:5</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "IBM Plex Sans"; src: url("assets/IBMPlexSans-Regular.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "IBM Plex Sans"; src: url("assets/IBMPlexSans-SemiBold.otf") format("opentype"); font-weight: 600; }
      @font-face { font-family: "IBM Plex Mono"; src: url("assets/IBMPlexMono-Regular.otf") format("opentype"); font-weight: 400 600; }
      html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: #0B0F13; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: #F1F4F7;
              font-family: "IBM Plex Sans", sans-serif; font-size: 40px; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .head { position: absolute; left: 60px; top: 80px; width: 960px; font-weight: 600; font-size: 64px; line-height: 1.2; }
      .panel { position: absolute; left: 60px; top: 420px; width: 960px; height: 520px; border: 3px solid #669EE4; }
      .label { position: absolute; left: 40px; top: 40px; font-size: 40px; }
      .code { position: absolute; left: 40px; top: 160px; font-family: "IBM Plex Mono", monospace; font-size: 40px; }
      .band { position: absolute; left: 60px; top: 1110px; width: 960px; height: 200px; }
      .cap { font-size: 68px; line-height: 1.1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1350">
      <section id="b01" class="clip" data-start="0" data-duration="3" data-track-index="1">
        <div class="head" id="h1">Who shares patients with Dr. A?</div>
        <div class="panel" data-panel="Lakebase">
          <div class="label" id="lab">served views</div>
          <div class="code" id="code" data-code>GROUP BY e.dst_node_id</div>
        </div>
        <div class="band" data-caption-band><div class="cap">One walk, 4 hops.</div></div>
      </section>
      <section id="b02" class="clip" data-start="3" data-duration="3" data-track-index="1">
        <div class="head" id="h2">788 seconds from first check to served graph.</div>
        <div class="band" data-caption-band><div class="cap">Each hop is one CTE.</div></div>
      </section>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        gsap.set("#h2", { opacity: 0 });
        tl.to("#h2", { opacity: 1, duration: 0.3, ease: "none" }, 3.0);
        tl.set({}, {}, 6);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
