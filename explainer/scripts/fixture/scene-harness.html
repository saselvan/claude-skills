<!doctype html>
<!-- Mounts one scene file for the explainer checks, offline, with no HyperFrames runtime. film_probe.py copies this
     file next to index.html with the scene's <template> pasted at SCENE, opens it in headless Chrome, and reads
     window.__timelines.main. Nothing is fetched: the scene is inlined, so file:// restrictions do not apply. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="tokens.css" />
    <script src="assets/gsap.min.js"></script>
    <script src="tokens.js"></script>
    <style> html, body { margin: 0; overflow: hidden; } </style>
  </head>
  <body>
    <div id="scene-source" hidden><!--SCENE--></div>
    <script>
      window.__timelines = window.__timelines || {};
      (async function () {
        var tpl = document.querySelector("#scene-source template");
        var frag = document.importNode(tpl.content, true);
        var root = frag.querySelector("[data-composition-id]");
        var id = root.getAttribute("data-composition-id");
        var w = +root.getAttribute("data-width"), h = +root.getAttribute("data-height");
        document.documentElement.style.width = document.body.style.width = w + "px";
        document.documentElement.style.height = document.body.style.height = h + "px";
        var scripts = Array.from(frag.querySelectorAll("script"));   // template scripts do not run on import
        scripts.forEach(function (s) { s.remove(); });
        document.body.appendChild(frag);
        document.querySelector("#scene-source").remove();
        await document.fonts.ready;
        scripts.forEach(function (s) { var n = document.createElement("script"); n.textContent = s.textContent; document.body.appendChild(n); });
        for (var i = 0; i < 400 && !window.__timelines[id]; i++) await new Promise(function (r) { setTimeout(r, 25); });
        window.__timelines.main = window.__timelines[id];
        window.__sceneId = id;
      })();
    </script>
  </body>
</html>
