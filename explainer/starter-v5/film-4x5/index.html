          PR(B.code.pn, CODE9, 61.8, 0.6);
          const inner9 = R(B.code.p, 0, 0, CODE9[2] - 6, CODE9[3] - 6, { overflow: "hidden" });
          const TR = SQL9.map((ln, i) => R(inner9, 6, 2 + i * 52, CODE9[2] - 18, 52, {
            background: C.codeBg, color: C.ink2, borderRadius: "6px", font: F.code, whiteSpace: "pre", paddingLeft: 16 + (ln.ind || 0) * IND + "px",
          }, ln.t));
          // the last row fills the panel to its inner edge: the rows fade in in place, so none is cut
          TR.forEach((r) => rollIn(r, 62.4, 0.4, 0));
          const tag9 = own(hidden(T(s, "simplified", TAG9[0], TAG9[1], { font: F.kick, color: C.ink2, w: 260, al: "right", plate: C.lbS })), B.code, true);
          show(tag9, 62.4);
          const T0 = tree(s, false);
          own(T0.g, B.lb);
          gsap.set(T0.seed, { x: -12, opacity: 0 });
          tl.to(T0.seed, { x: 0, opacity: 1, duration: 0.4, ease: LAY }, 62.4);
          [T0.data, T0.credit, T0.few].forEach(hidden);
          show([T0.data, T0.credit, T0.few], 62.9);
          const cn = counter(s, 0);
          own(cn.g, B.lb);
          gsap.set(cn.g, { opacity: 0 });
          show(cn.g, 62.4, 0.4);
          lit(TR[0], 62.4, 62.9);
          lit(TR[1], 62.4, 62.9);
          // turn 1 (62.9) and turn 2 (64.7): one level per turn, all at once
          [[1, 62.9, 63.9, 0], [2, 64.7, 65.7, 1]].forEach(([d, t0, t1, from]) => {
            lit(TR[2], t0, t1);
            lit(TR[3], t0, t1);
            rollNum(cn, from, d, t0, t1);
            const lv = T0.lv[d];
            const tSnap = t0 + Math.max(...lv.map((x) => x.e.L)) / SPEED;
            lv.forEach((x) => {
              reveal(x.e.line, t0);
              tl.set(x.ng, { opacity: 1 }, tSnap);
              tl.set(x.e.ln, { strokeWidth: "3px" }, t1);
              tl.to(x.e.ln, { stroke: x.col, duration: 0.5, ease: "none" }, t1);
            });
          });
          // the loop stops at the depth limit; fully settled by 68.0 for the style frame
          lit(TR[5], 66.5, 67.5);
          beatCaptions(s, 9);
        }

        /* =====================================================================
           Beat 10 — a new version, in one transaction (70.5–75.5)
           View cards on top; v1 and v2 side by side under them. The v2 write drops vertically; pointers run
           diagonally. The view-to-table map is monotone (left view to left table), so no two pointers ever cross.
           ===================================================================== */
        // The three-line headline takes the top band (the kicker leaves). Views stack on the left; v1 above v2 on the
        // right, three cards each (nodes, edges, node_id_map). Each view points to its own table; the ends keep the
        // views' top-to-bottom order, so no two pointers cross, and every pointer ends on the cards' shared left edge.
        const VIEWX = 72, VIEWS = [470, 590, 710], VW = 160, VCX = 560, VCW = 200, VCH = 72, VNX = 776;
        const VER = { v1: [470, 550, 630], v2: [770, 850, 930] };
        const TNAME = ["nodes", "edges", "node_id_map"];
        const BR10 = [264, 444, 256, 560];
        function vcard(g, y, dim) {
          const k = card(g, VCX, y, "pg", dim);
          k.c.style.width = VCW + "px";
          k.c.style.height = VCH + "px";
          k.marks.splice(2).forEach((m) => m.remove());
          return k;
        }
        function versions(s, st) {
          const end = st === "end";
          const g = R(s, 0, 0, FW, FH);
          const views = VIEWS.map((y) => {
            const v = R(g, VIEWX, y, VW, 88, { background: C.lbC, border: `3px solid ${C.lbL}`, borderRadius: "6px", overflow: "hidden" });
            [24, 54].forEach((yy) => R(v, 21, yy - 3, 112, 6, { background: C.lbL }));
            return v;
          });
          const lv = T(g, "served views", VIEWX, 344, { w: 300 });
          const v1 = VER.v1.map((y) => vcard(g, y, end));
          const v2 = VER.v2.map((y) => vcard(g, y));
          const n1 = VER.v1.map((y, i) => T(g, TNAME[i], VNX, y + VCH / 2 - 23, { w: 260 }));
          const n2 = VER.v2.map((y, i) => T(g, TNAME[i], VNX, y + VCH / 2 - 23, { w: 260 }));
          const l1 = T(g, "v1", VNX, VER.v1[0] - 56, { w: 120 });
          const l2 = T(g, "v2", VNX, VER.v2[0] - 56, { w: 120 });
          const svg = S("svg", g, { width: FW, height: FH }, { position: "absolute", left: "0px", top: "0px" });
          const ys = end ? VER.v2 : VER.v1;
          const ptr = VIEWS.map((y, vi) =>
            S("line", svg, { x1: VIEWX + VW, y1: y + 44, x2: VCX, y2: ys[vi] + VCH / 2 }, { stroke: C.lbL, strokeWidth: "3px" }));
          const br = R(g, BR10[0], BR10[1], BR10[2], BR10[3], { border: `3px solid ${C.lbL}`, borderRadius: "6px" });
          const bcx = BR10[0] + BR10[2] / 2;
          const lbt = T(g, "one transaction", bcx, BR10[1] - 26, { al: "center", w: 360, plate: C.lbS });
          const lan = T(g, "all or none", bcx, BR10[1] + BR10[3] - 26, { al: "center", w: 300, plate: C.lbS });
          return { g, views, lv, v1, v2, n1, n2, l1, l2, ptr, br, lbt, lan };
        }
        function b10() {
          const s = $("b10");
          // Beat 9 end state
          const B = sigBase(s, { head: "tree", kick: KICK9, uc: false, lb: LB9, tabCx: 860, strip: false, codeBox: CODE9, rows: SQL9, codeClip: false, tagAt: TAG9 });
          B.code.rows.forEach((r) => (r.style.top = parseFloat(r.style.top) - 10 + "px"));
          const T9 = tree(s, true);
          const cn = counter(s, 2);
          const hv = head(s, "ver", { top: 24 });
          swap(B.head, hv, 70.5);
          swap(B.kick, null, 70.5);
          // the walk fades out whole (a crop would cut its lines); the versions are drawn on clear space from 71.1
          hide([B.code.p, B.tag, T9.g, cn.g], 70.5, 0.4);
          const V = versions(s, "start");
          [...V.views, ...V.v1.map((k) => k.c)].forEach((el) => {
            gsap.set(el, { clipPath: "inset(0% 100% 0% 0%)" });
            tl.to(el, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: LAY }, 71.1);
          });
          [V.lv, V.l1, ...V.n1].forEach((el) => { hidden(el); show(el, 71.6); });
          V.ptr.forEach((p) => { hidden(p); show(p, 71.7, 0.2); });
          // v2 is written inside the database: a vertical drop
          V.v2.forEach((k) => {
            gsap.set(k.c, { y: -12, opacity: 0, borderColor: C.now });
            tl.to(k.c, { y: 0, opacity: 1, duration: 1.0, ease: LAY }, 71.3);
            tl.to(k.c, { borderColor: C.lbL, duration: 0.5, ease: "none" }, 72.3);
          });
          [V.l2, ...V.n2].forEach((el) => { hidden(el); show(el, 72.1); });
          // the lit 6 px bracket closes; at the switch it hands over to the resting 3 px bracket (no border-width change)
          const br6 = R(V.g, BR10[0], BR10[1], BR10[2], BR10[3], { border: `6px solid ${C.now}`, borderRadius: "6px" });
          V.br.after(br6);
          gsap.set(br6, { clipPath: "inset(50% 0% 50% 0%)" });
          gsap.set(V.br, { opacity: 0, borderColor: C.now });
          tl.to(br6, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: LAY }, 72.3);
          hidden(V.lbt);
          show(V.lbt, 72.4);
          // the switch: every pointer leaves v1 and lands on v2 on the same frame — one set, no travel, no stagger
          tl.set(V.ptr, { stroke: C.now, strokeWidth: "6px" }, 72.8);
          V.ptr.forEach((p, vi) => tl.set(p, { attr: { y2: VER.v2[vi] + VCH / 2 } }, 72.8));
          tl.set(V.ptr, { strokeWidth: "3px" }, 73.3);
          tl.to(V.ptr, { stroke: C.lbL, duration: 0.5, ease: "none" }, 73.3);
          tl.set(br6, { opacity: 0 }, 73.3);
          tl.set(V.br, { opacity: 1 }, 73.3);
          tl.to(V.br, { borderColor: C.lbL, duration: 0.5, ease: "none" }, 73.3);
          V.v1.forEach((k) => dimCard(k, 73.3));
          hidden(V.lan);
          show(V.lan, 73.3);
          beatCaptions(s, 10);
        }

        /* =====================================================================
           Beat 11 — each answer equals a reference from the source tables (75.5–80.5)
           The reference sits outside Unity Catalog and reads only the providers and referrals source tables. Its read lines run
           right, away from the dim nodes and edges cards; no line or bar enters the left column.
           ===================================================================== */
        const UC11 = [40, 300, 560, 510], LB11 = [40, 850, 1000, 250];
        const REF11 = [640, 324, 400, 364];
        const BARX = 760, REFBAR_Y = 778, SRVBAR_Y = 880;
        function checkScene(s, st) {
          const end = st === "end";
          const g = R(s, 0, 0, FW, FH);
          card(g, 64, 324, "delta", true);
          card(g, 64, 544, "delta", true);
          const uinT = [
            T(g, "nodes", 172, 480, { al: "center", w: 200 }),
            T(g, "edges", 172, 700, { al: "center", w: 200 }),
          ];
          card(g, 344, 324, "delta");
          card(g, 344, 544, "delta");
          uinT.push(
            T(g, "providers", 452, 480, { al: "center", w: 240 }),
            T(g, "referrals", 452, 700, { al: "center", w: 240 }),
            T(g, "source tables", 452, 756, { al: "center", w: 280, color: C.ink2 }),
          );
          const ref = R(g, REF11[0], REF11[1], REF11[2], REF11[3], {
            background: C.spS, border: `3px solid ${C.spL}`, borderRadius: "6px",
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
            font: F.label, color: C.ink, textAlign: "center", whiteSpace: "nowrap",
          });
          ref.setAttribute("aria-label", "reference (SQL warehouse + Python)");
          ["reference", "(SQL warehouse", "+ Python)"].forEach((ln) => E("span", ref, { display: "block" }, ln));
          const reads = [
            edge(g, 560, 396, REF11[0], 396, 3, end ? C.spL : C.now, { shown: end }),
            edge(g, 560, 616, REF11[0], 616, 3, end ? C.spL : C.now, { shown: end }),
          ];
          const refBar = R(g, BARX, end ? REFBAR_Y : 620, 240, 48, { background: C.spS, border: `3px solid ${C.spL}`, borderRadius: "6px" });
          const srvBar = R(g, BARX, SRVBAR_Y, 240, 48, { background: C.lbC, border: `3px solid ${C.lbL}`, borderRadius: "6px" });
          const lsrv = T(g, "served answer", 1004, 936, { al: "right", w: 300 });
          const eq = R(g, 740, REFBAR_Y, 6, SRVBAR_Y + 48 - REFBAR_Y, { background: end ? C.ink2 : C.now });
          const leq = T(g, "equal", 728, REFBAR_Y, { al: "right", w: 120 });
          return { g, ref, reads, refBar, srvBar, lsrv, eq, leq, uinT };
        }
        function b11() {
          const s = $("b11");
          // Beat 10 end state
          const hv = head(s, "ver", { top: 24 });
          const lb = P(s, LB9, C.lbS, C.lbL, "Lakebase Postgres", 860);
          const V = versions(s, "end");
          const he = head(s, "eq");
          swap(hv, he, 75.5);
          // 75.5–75.8 the versions and the Lakebase tab leave; 75.8–76.9 the panels resize; the check scene and the
          // tabs show once both have settled
          hide([V.g, lb.tw], 75.5);
          PR(lb, LB11, 75.8, 1.1, 300);
          show(lb.tw, 76.9, 0.3);
          const uc = P(s, UC11, C.ucS, C.ucL, "Unity Catalog", 320);
          boxSet(uc, [40, 300, 12, 510], 320);
          gsap.set(uc.tw, { opacity: 0 });
          PR(uc, UC11, 75.8, 1.1, 320);
          show(uc.tw, 76.9, 0.3);
          const K = checkScene(s, "start");
          K.uinT.forEach((el) => own(el, uc));
          gsap.set(K.g, { opacity: 0 });
          show(K.g, 76.9, 0.3);
          // the reference reads only the source tables
          K.reads.forEach((e) => { reveal(e, 77.0); tl.to(e.ln, { stroke: C.spL, duration: 0.5, ease: "none" }, 77.4); });
          hidden(K.refBar);
          tl.set(K.refBar, { opacity: 1 }, 77.4);
          // the reference row leaves its card straight down and stacks over the served answer
          mv(K.refBar, null, REFBAR_Y, 77.5, 0.6);
          gsap.set(K.eq, { clipPath: "inset(0% 0% 100% 0%)" });
          tl.to(K.eq, { clipPath: "inset(0% 0% 0% 0%)", duration: (SRVBAR_Y + 48 - REFBAR_Y) / SPEED, ease: "none" }, 78.1);
          hidden(K.leq);
          show(K.leq, 78.1, 0.2);
          tl.to(K.eq, { backgroundColor: C.ink2, duration: 0.5, ease: "none" }, 78.7);
          beatCaptions(s, 11);
        }

        /* =====================================================================
           Beat 12 — the claim, inside Databricks (80.5–90.6)
           The map stacks top to bottom; the Databricks tab and the Unity Catalog tab sit at opposite ends.
           ===================================================================== */
        const UCM = [72, 460, 936, 236], LBM = [72, 740, 936, 212], APM = [72, 996, 936, 92];
        const BND0 = [72, 460, 936, 628], BND = [40, 412, 1000, 688];
        const TAB_DBX = 860, TAB_UC = 300;
        function mapScene(s, on) {
          const g = R(s, 0, 0, FW, FH);
          card(g, 87, 528, "delta");
          card(g, 319, 528, "delta");
          entry(g, 551, 528);
          entry(g, 783, 528);
          own(T(g, "UC entry · synced table", 775, 476, { al: "center", w: 460 }), on.uc);
          card(g, 96, 764, "pg");
          const strip = R(g, 336, 764, 104, 144, { background: C.lbC, border: `3px solid ${C.lbL}`, borderRadius: "6px" });
          for (let i = 0; i < 3; i++) R(strip, 21, 21 + i * 36, 56, 6, { background: C.lbL });
          own(T(g, "reader: views only", 456, 776, { w: 360 }), on.lb);
          graph(g, { cx: 900, cy: 852, r1: [52, 40], r2: [86, 64], st: "end", mini: true }); // the faint Beat 6 walk, settled
          own(R(g, 90, 1016, 400, 52, { color: C.ink, font: F.code, paddingLeft: "16px", whiteSpace: "pre" }, "SET ROLE reader"), on.ap);
          return g;
        }
        function b12() {
          const s = $("b12");
          // Beat 11 end state
          const he = head(s, "eq");
          const uc = P(s, UC11, C.ucS, C.ucL, "Unity Catalog", 320);
          const lb = P(s, LB11, C.lbS, C.lbL, "Lakebase Postgres", 300);
          const K = checkScene(s, "end");
          K.uinT.forEach((el) => own(el, uc));
          // 80.5–80.8 the check scene and the tabs leave; 80.8–81.9 the panels resize; the four-line headline rolls in
          // once the Unity Catalog panel's top edge is below its last line (y 401 at 81.43)
          const hEnd = head(s, "end", { font: F.end, top: 52 });
          swap(he, null, 80.5);
          rollIn(hEnd, 81.5, 0.8);
          hide([K.g, uc.tw, lb.tw], 80.5);
          show([uc.tw, lb.tw], 81.9, 0.3);
          PR(uc, UCM, 80.8, 1.1, TAB_UC);
          PR(lb, LBM, 80.8, 1.1, 540);
          const ap = P(s, APM, C.apS, C.apL, "app", 700);
          boxSet(ap, [72, 996, 12, 92], 700);
          gsap.set(ap.tw, { opacity: 0 });
          PR(ap, APM, 80.8, 1.1, 700);
          show(ap.tw, 81.9, 0.3);
          const M = mapScene(s, { uc, lb, ap });
          gsap.set(M, { opacity: 0 });
          show(M, 81.9, 0.6);
          // the Databricks boundary grows outward from the panels' edges; `now` only while it draws
          const bdb = P(s, BND0, null, C.now, null, null, { bw: 6, name: "Databricks" });
          const bd = bdb.p;
          bd.setAttribute("data-layout-allow-overflow", "");
          gsap.set(bd, { opacity: 0 });
          tl.set(bd, { opacity: 1 }, 80.8);
          PR(bdb, BND, 80.8, 1.1);
          boxColor(bdb, null, C.bnd, 81.9, 0.5);
          // the Databricks tab sits at the right end of the boundary, clear of the Unity Catalog tab on the left
          const bt = hidden(T(s, "Databricks", TAB_DBX, BND[1] - 26, { al: "center", w: 260, color: C.bnd, plate: C.ground }));
          own(bt, bdb, true);
          show(bt, 81.9, 0.4);
          // the code link fades in place: a roll would cross the headline below it
          const k12 = hidden(T(s, KICK12, 40, 4, { font: F.label, color: C.ink2, w: 1000 }));
          show(k12, 88.7, 0.6);
          beatCaptions(s, 12);
        }

        function build() {
          b01(); b02(); b03(); b04(); b05(); b06(); b07(); b08(); b09(); b10(); b11(); b12();
          tl.progress(1).progress(0);
          window.__timelines["main"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        }
        window.__timelines = window.__timelines || {};
        const loads = ["400 40px", "500 40px", "600 40px"].map((w) => document.fonts.load(w + ' "IBM Plex Sans"'));
        loads.push(document.fonts.load('400 38px "IBM Plex Mono"'));
        Promise.all(loads).then(build, build);
      })();
    </script>
  </body>
</html>
